[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ede"
version = "0.1.0"
description = "Engineering Discipline Enforcer — DeepSeek-optimized agentic engineering CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
ede = "ede.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["ede*"]
